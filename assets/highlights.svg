<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-label="~7 years across the data stack; 130 TB Snowflake warehouse; dbt pipeline runtime cut from 30 minutes to 6">
  <g>
    <rect x="0.75" y="0.75" width="318.5" height="88.5" rx="16" fill="#1B3E63" stroke="#2E6498" stroke-width="1.5"/>
    <text x="160" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#F2F7FC">~7 yrs</text>
    <text x="160" y="66" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#9FC7EC">across the data stack</text>
  </g>
  <g>
    <rect x="340.75" y="0.75" width="318.5" height="88.5" rx="16" fill="#1B3E63" stroke="#2E6498" stroke-width="1.5"/>
    <text x="500" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#F2F7FC">130 TB</text>
    <text x="500" y="66" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#9FC7EC">snowflake warehouse</text>
  </g>
  <g>
    <rect x="680.75" y="0.75" width="318.5" height="88.5" rx="16" fill="#1B3E63" stroke="#2E6498" stroke-width="1.5"/>
    <text x="840" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="600" fill="#F2F7FC">30 min → 6</text>
    <text x="840" y="66" text-anchor="middle" font-family="SFMono-Regular, ui-monospace, Consolas, monospace" font-size="12.5" letter-spacing="1" fill="#9FC7EC">dbt pipeline runtime</text>
  </g>
</svg>
